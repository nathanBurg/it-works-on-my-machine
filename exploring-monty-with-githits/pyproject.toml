[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safebox"
version = "0.1.0"
description = "Local demo agent for safely executing model-written Python with Monty"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "pydantic-ai==1.107.0",
  "pydantic-monty==0.0.18",
]

[project.scripts]
safebox = "safebox.cli:main"
safebox-2 = "safebox.phase2_cli:main"
safebox-3 = "safebox.phase3_cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
